name: Build plugin and licensed sound pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Install audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Synthesize original CC0 pack (no Myinstants downloads)
        shell: pwsh
        run: ./scripts/build-public-pack.ps1
      - name: Prepare and verify distribution
        shell: pwsh
        run: ./scripts/test-distribution.ps1
      - name: Upload plugin and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fartmc-plugin
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/fartplugin-*.jar
            dist/fartmc-source.zip
            dist/LICENSE
            dist/NOTICE.md
            dist/SHA256SUMS
      - name: Upload original sound pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fartmc-sounds
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/fartmc-sounds.zip
            dist/SHA256SUMS
