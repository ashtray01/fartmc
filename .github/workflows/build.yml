name: FartMC · Paper 26.3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test plugin
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Install audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Build the FartMC sound pack
        shell: pwsh
        run: ./scripts/build-public-pack.ps1
      - name: Prepare and verify distribution
        shell: pwsh
        run: ./scripts/prepare-distribution.ps1
      - name: Upload plugin and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fartmc-plugin
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/fartplugin-*.jar
            dist/fartmc-source.zip
            dist/LICENSE
            dist/NOTICE.md
            dist/SHA256SUMS
      - name: Upload all 28 sounds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fartmc-sounds
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/fartmc-sounds.zip
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: fartmc-*
          merge-multiple: true
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          plugin="fartplugin-${RELEASE_TAG#v}.jar"
          test -f "$plugin"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving published assets."
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "FartMC ${RELEASE_TAG#v}" --generate-notes \
              "$plugin" fartmc-sounds.zip fartmc-source.zip LICENSE NOTICE.md SHA256SUMS
          fi
